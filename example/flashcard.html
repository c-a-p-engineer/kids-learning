<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Emoji Flash Score Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap');

    body {
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
      min-height: 100vh;
      overflow: hidden;
    }

    /* アニメーションなし */
    .flashcard {
      transition: none;
    }

    /* 記号表示用のスタイル（アニメーションなし） */
    .symbol-ok {
      color: #ff4757;
      font-size: 12rem;
      font-weight: 900;
    }
    .symbol-ng {
      color: #374151;
      font-size: 12rem;
      font-weight: 900;
    }

    .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
    .btn-choice { transition: all 0.1s; border-bottom-width: 6px; }
    .btn-choice:active { transform: translateY(2px); border-bottom-width: 2px; }
  </style>
</head>
<body class="flex flex-col items-center p-4">

  <!-- Header -->
  <header class="w-full max-w-md flex items-center justify-between glass p-4 rounded-2xl shadow-sm mb-6">
    <div class="flex items-center gap-2">
      <div class="bg-indigo-600 p-2 rounded-lg text-white">
        <i data-lucide="award" class="w-4 h-4"></i>
      </div>
      <h1 class="text-sm font-black text-indigo-900 uppercase">Emoji Flash</h1>
    </div>
    <div class="flex items-center gap-4">
      <button id="btnHistory" class="p-2 text-gray-400 hover:text-indigo-600">
        <i data-lucide="history" class="w-6 h-6"></i>
      </button>
      <div id="progress" class="text-lg font-black text-indigo-600">0/0</div>
    </div>
  </header>

  <main class="flex-1 w-full flex flex-col items-center justify-center relative">
    
    <!-- Level Select View -->
    <div id="viewIdle" class="w-full max-w-sm space-y-4">
      <h2 class="text-2xl font-black text-center text-indigo-900 mb-8">レベルをえらぼう！</h2>
      <button onclick="startGame(1)" class="w-full bg-white p-6 rounded-3xl shadow-xl flex items-center justify-between border-b-4 border-green-200 active:scale-95 transition-all">
        <div class="text-left">
          <span class="text-xl font-black text-green-600 block">🟢 やさしい</span>
          <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">5枚 / クイズ2問</span>
        </div>
        <i data-lucide="play" class="text-green-500 fill-current"></i>
      </button>
      <button onclick="startGame(2)" class="w-full bg-white p-6 rounded-3xl shadow-xl flex items-center justify-between border-b-4 border-orange-200 active:scale-95 transition-all">
        <div class="text-left">
          <span class="text-xl font-black text-orange-600 block">🟠 ふつう</span>
          <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">10枚 / クイズ3問</span>
        </div>
        <i data-lucide="play" class="text-orange-500 fill-current"></i>
      </button>
      <button onclick="startGame(3)" class="w-full bg-white p-6 rounded-3xl shadow-xl flex items-center justify-between border-b-4 border-red-200 active:scale-95 transition-all">
        <div class="text-left">
          <span class="text-xl font-black text-red-600 block">🔴 むずかしい</span>
          <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">15枚 / クイズ4問</span>
        </div>
        <i data-lucide="play" class="text-red-500 fill-current"></i>
      </button>
    </div>

    <!-- Game View (Flash Card) -->
    <div id="viewGame" class="hidden w-full max-w-xs relative">
      <div id="card" class="flashcard bg-white rounded-[3rem] shadow-2xl aspect-[3/4] flex flex-col items-center justify-center p-8 border-b-8 border-indigo-100">
        <div id="emoji" class="text-9xl mb-4 select-none"></div>
        <div id="kana" class="text-4xl font-black text-indigo-900"></div>
      </div>
    </div>

    <!-- Quiz View -->
    <div id="viewQuiz" class="hidden w-full max-w-sm space-y-6">
      <div class="text-center">
        <div id="quizStepInfo" class="text-xs font-black text-indigo-400 uppercase mb-1 tracking-widest">Question 1/2</div>
        <h2 class="text-2xl font-black text-indigo-900">これはあったかな？</h2>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <button id="choice0" class="btn-choice bg-white p-8 rounded-[2.5rem] shadow-xl flex flex-col items-center gap-4 border-gray-100">
          <span class="text-7xl emoji"></span>
          <span class="text-sm font-bold text-gray-400 kana"></span>
        </button>
        <button id="choice1" class="btn-choice bg-white p-8 rounded-[2.5rem] shadow-xl flex flex-col items-center gap-4 border-gray-100">
          <span class="text-7xl emoji"></span>
          <span class="text-sm font-bold text-gray-400 kana"></span>
        </button>
      </div>
    </div>

    <!-- Result View -->
    <div id="viewResult" class="hidden w-full max-w-sm flex flex-col items-center space-y-8 bg-white p-10 rounded-[3rem] shadow-2xl border-b-8 border-indigo-100">
      <div class="text-center">
        <h2 class="text-3xl font-black text-indigo-900 mb-2">スコアは...</h2>
        <div id="resultScore" class="text-7xl font-black text-indigo-600 mb-4">0/0</div>
        <div id="resultMessage" class="text-xl font-black text-orange-500">よくがんばったね！</div>
      </div>
      <button onclick="backToTitle()" class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-black text-xl shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">
        タイトルにもどる
      </button>
    </div>

    <!-- Feedback Overlay -->
    <div id="feedback" class="fixed inset-0 pointer-events-none z-50 flex items-center justify-center opacity-0 transition-opacity duration-100">
        <div id="feedbackIcon" class="w-64 h-64 flex items-center justify-center"></div>
    </div>
  </main>

  <!-- History Overlay -->
  <div id="overlay" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-[100]">
    <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
      <div class="p-6 border-b flex items-center justify-between bg-indigo-50/50">
        <h3 class="font-black text-indigo-900">これまでのきろく</h3>
        <button id="btnCloseHistory" class="p-2"><i data-lucide="x"></i></button>
      </div>
      <div id="historyList" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
      <div class="p-4 bg-gray-50 text-center">
        <button onclick="clearHistory()" class="text-xs font-bold text-red-400 uppercase tracking-widest">Clear History</button>
      </div>
    </div>
  </div>

  <script>
    const EMOJIS = [
      {char:'🐶', kana:'いぬ'}, {char:'🐱', kana:'ねこ'}, {char:'🐭', kana:'ねずみ'},
      {char:'🐰', kana:'うさぎ'}, {char:'🦊', kana:'きつね'}, {char:'🐻', kana:'くま'},
      {char:'🐼', kana:'ぱんだ'}, {char:'🐯', kana:'とら'}, {char:'🦁', kana:'らいおん'},
      {char:'🍎', kana:'りんご'}, {char:'🍊', kana:'みかん'}, {char:'🍋', kana:'れもん'},
      {char:'🍌', kana:'ばなな'}, {char:'🍉', kana:'すいか'}, {char:'🍇', kana:'ぶどう'},
      {char:'🚗', kana:'くるま'}, {char:'🚒', kana:'しょうぼうしゃ'}, {char:'🚑', kana:'きゅうきゅうしゃ'},
      {char:'🚓', kana:'ぱとかー'}, {char:'🚁', kana:'へりこぷたー'}, {char:'🚂', kana:'きかんしゃ'},
      {char:'🚀', kana:'ろけっと'}, {char:'🎂', kana:'けーき'}, {char:'🌈', kana:'にじ'},
      {char:'🍦', kana:'あいす'}, {char:'🍟', kana:'ぽてと'}, {char:'⚽', kana:'さっかー'}
    ];

    const LEVELS = {
      1: { name: 'やさしい', count: 5, speed: 1100, quizCount: 2, ttsRate: 1.2 },
      2: { name: 'ふつう', count: 10, speed: 750, quizCount: 3, ttsRate: 1.5 },
      3: { name: 'むずかしい', count: 15, speed: 450, quizCount: 4, ttsRate: 2.2 }
    };

    let state = {
      currentRun: [],
      availableForQuiz: [],
      currentIndex: 0,
      config: null,
      quizStep: 0,
      correctCount: 0,
      history: JSON.parse(localStorage.getItem('emoji_v10_history') || '[]')
    };

    const playSE = (type) => {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      if (type === 'ok') {
        osc.frequency.setValueAtTime(523, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
      }
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.5);
    };

    const speakKana = (text, rate) => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      uttr.rate = rate;
      window.speechSynthesis.speak(uttr);
    };

    const startGame = (lv) => {
      state.config = LEVELS[lv];
      state.currentRun = [...EMOJIS].sort(() => 0.5 - Math.random()).slice(0, state.config.count);
      state.availableForQuiz = [...state.currentRun];
      state.currentIndex = 0;
      state.quizStep = 0;
      state.correctCount = 0;
      
      speakKana('', 1.0);
      document.getElementById('viewIdle').classList.add('hidden');
      document.getElementById('viewGame').classList.remove('hidden');
      showNextCard();
    };

    const showNextCard = () => {
      if (state.currentIndex >= state.currentRun.length) {
        setTimeout(startQuizMode, 400);
        return;
      }

      const item = state.currentRun[state.currentIndex];
      const emojiEl = document.getElementById('emoji');
      const kanaEl = document.getElementById('kana');

      emojiEl.textContent = item.char;
      kanaEl.textContent = item.kana;
      document.getElementById('progress').textContent = `${state.currentIndex + 1}/${state.currentRun.length}`;

      speakKana(item.kana, state.config.ttsRate);

      setTimeout(() => {
        state.currentIndex++;
        showNextCard();
      }, state.config.speed);
    };

    const startQuizMode = () => {
      document.getElementById('viewGame').classList.add('hidden');
      document.getElementById('viewQuiz').classList.remove('hidden');
      nextQuizStep();
    };

    const nextQuizStep = () => {
      if (state.quizStep >= state.config.quizCount) {
        showResult();
        return;
      }

      document.getElementById('quizStepInfo').textContent = `Question ${state.quizStep + 1}/${state.config.quizCount}`;

      const poolIndex = Math.floor(Math.random() * state.availableForQuiz.length);
      const correct = state.availableForQuiz.splice(poolIndex, 1)[0];

      let wrong;
      do { wrong = EMOJIS[Math.floor(Math.random() * EMOJIS.length)]; } 
      while (state.currentRun.some(r => r.char === wrong.char));

      const choices = [correct, wrong].sort(() => 0.5 - Math.random());
      choices.forEach((c, i) => {
        const btn = document.getElementById(`choice${i}`);
        btn.querySelector('.emoji').textContent = c.char;
        btn.querySelector('.kana').textContent = c.kana;
        btn.onclick = () => handleQuizAnswer(c.char === correct.char);
      });
    };

    const handleQuizAnswer = (isCorrect) => {
      const feedback = document.getElementById('feedback');
      const icon = document.getElementById('feedbackIcon');
      
      feedback.classList.add('opacity-100');
      if (isCorrect) {
        state.correctCount++;
        playSE('ok');
        // アニメーションなしの記号を表示
        icon.innerHTML = `<span class="symbol-ok">○</span>`;
      } else {
        playSE('ng');
        // アニメーションなしの記号を表示
        icon.innerHTML = `<span class="symbol-ng">×</span>`;
      }

      setTimeout(() => {
        feedback.classList.remove('opacity-100');
        state.quizStep++;
        nextQuizStep();
      }, 700); // フィードバック表示時間を少し短縮
    };

    const showResult = () => {
      document.getElementById('viewQuiz').classList.add('hidden');
      document.getElementById('viewResult').classList.remove('hidden');
      
      const scoreEl = document.getElementById('resultScore');
      const msgEl = document.getElementById('resultMessage');
      const score = state.correctCount;
      const total = state.config.quizCount;
      
      scoreEl.textContent = `${score}/${total}`;
      
      if (score === total) {
        msgEl.textContent = "💯 はなまる！ かんぺきだね！";
        msgEl.className = "text-xl font-black text-red-500";
      } else if (score >= total / 2) {
        msgEl.textContent = "✨ おしい！ あとすこしだね！";
        msgEl.className = "text-xl font-black text-orange-500";
      } else {
        msgEl.textContent = "🌈 またこんどがんばろう！";
        msgEl.className = "text-xl font-black text-indigo-500";
      }

      saveToHistory();
    };

    const backToTitle = () => {
      document.getElementById('viewResult').classList.add('hidden');
      document.getElementById('viewIdle').classList.remove('hidden');
      document.getElementById('progress').textContent = '0/0';
    };

    const saveToHistory = () => {
      const accuracy = Math.round((state.correctCount / state.config.quizCount) * 100);
      const now = new Date();
      state.history.unshift({
        id: Date.now(),
        date: now.toLocaleDateString('ja-JP', {month:'2-digit', day:'2-digit'}) + ' ' + now.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}),
        levelName: state.config.name,
        score: `${state.correctCount}/${state.config.quizCount}`,
        accuracy: accuracy,
        emojiList: state.currentRun.map(e => e.char).join('')
      });
      localStorage.setItem('emoji_v10_history', JSON.stringify(state.history.slice(0, 50)));
    };

    const renderHistory = () => {
      const list = document.getElementById('historyList');
      if (state.history.length === 0) {
        list.innerHTML = `<div class="text-center text-gray-300 py-12 font-bold">きろくなし</div>`;
        return;
      }
      list.innerHTML = state.history.map(h => `
        <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm flex flex-col gap-2">
          <div class="flex justify-between items-start">
            <div class="flex flex-col">
              <span class="text-[9px] font-black text-indigo-300 uppercase">${h.date}</span>
              <span class="font-black text-indigo-900">${h.levelName}</span>
            </div>
            <div class="text-right">
              <div class="text-xl font-black ${h.accuracy === 100 ? 'text-green-500' : h.accuracy >= 50 ? 'text-orange-500' : 'text-red-400'}">
                ${h.accuracy}%
              </div>
              <div class="text-[10px] font-bold text-gray-400">${h.score} 正解</div>
            </div>
          </div>
          <div class="bg-gray-50 p-2 rounded-xl text-lg tracking-tighter overflow-hidden whitespace-nowrap text-ellipsis">
            ${h.emojiList}
          </div>
        </div>
      `).join('');
    };

    const clearHistory = () => {
      state.history = [];
      localStorage.removeItem('emoji_v10_history');
      renderHistory();
    };

    document.getElementById('btnHistory').onclick = () => {
      renderHistory();
      document.getElementById('overlay').classList.remove('hidden');
      document.getElementById('overlay').classList.add('flex');
    };
    document.getElementById('btnCloseHistory').onclick = () => {
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('overlay').classList.remove('flex');
    };

    lucide.createIcons();
  </script>
</body>
</html>
