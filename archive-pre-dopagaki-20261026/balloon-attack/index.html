<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#86d9ff" />
    <meta name="description" content="カメラの前で手を動かして風船を割る、30秒の子ども向けゲームです。" />
    <title>30びょう バルーンアタック</title>
    <script type="module" crossorigin src="../assets/balloonAttack-D49GXDKk.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="../assets/balloonAttack-twLzOInH.css">
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <a class="home-link" href="../" aria-label="まなびのライブラリへもどる">🏠 もどる</a>
        <div class="score-board" aria-live="polite"><span>🎈</span><strong id="score">0</strong></div>
        <div class="timer" aria-live="polite"><span>⏱️</span><strong id="time">30</strong></div>
      </header>

      <section id="stage" class="stage" aria-label="バルーンアタックのゲーム画面">
        <video id="camera" class="camera" autoplay muted playsinline></video>
        <div id="balloon-layer" class="balloon-layer" aria-hidden="true"></div>
        <div id="effects" class="effects" aria-hidden="true"></div>
        <div id="hand-layer" class="hand-layer" aria-hidden="true"></div>
        <p id="hand-status" class="hand-status" aria-live="polite">✋ てを みせてね</p>

        <section id="start-panel" class="panel">
          <div class="panel-icon">🎈</div>
          <h1>バルーンアタック</h1>
          <p>カメラに てを みせて<br />✋マークで ふうせんを わろう！</p>
          <button id="start-button" class="primary-button" type="button">▶️ はじめる</button>
          <p class="camera-note">カメラの えいぞうは ほぞん・そうしん しません</p>
        </section>

        <section id="countdown-panel" class="countdown hidden" aria-live="assertive">
          <strong id="countdown-number">3</strong>
        </section>

        <section id="result-panel" class="panel hidden" aria-live="polite">
          <div class="panel-icon">👏</div>
          <h2>おしまい！</h2>
          <p><strong id="result-score">0</strong>こ われたよ！</p>
          <button id="retry-button" class="primary-button" type="button">🔁 もういっかい</button>
          <a class="secondary-button" href="../">🏠 おわる</a>
        </section>

        <section id="error-panel" class="panel hidden" role="alert">
          <div class="panel-icon">📷</div>
          <h2>カメラを つかえません</h2>
          <p id="error-message">ブラウザのカメラ許可を確認してください。</p>
          <button id="retry-camera-button" class="primary-button" type="button">🔄 もういちど</button>
          <a class="secondary-button" href="../">🏠 もどる</a>
        </section>
      </section>
    </main>
  </body>
</html>
